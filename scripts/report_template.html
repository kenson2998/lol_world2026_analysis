  const f0 = v => (v == null ? "—" : Math.round(v).toLocaleString());
  const sg = v => (v == null ? "—" : `${v > 0 ? "+" : ""}${Math.round(v).toLocaleString()}`);
  const wrTxt = (w, n) => `${Math.round(w / n * 100)}%(${w}W-${n - w}L)`;
  // [label, value, formatted]; rank compares players of the same lane, higher value first
  const STATS = [["KDA", r => r.kda, r => f1(r.kda)], ["擊殺", r => r.k, r => r.k], ["死亡", r => -r.d, r => r.d], ["助攻", r => r.a, r => r.a],
    ["參團率", r => r.kp, r => (r.kp == null ? "—" : `${Math.round(r.kp)}%`)], ["每分補兵", r => r.csm, r => f1(r.csm)],
    ["每分金錢", r => r.gpm, r => f0(r.gpm)], ["每分傷害", r => r.dpm, r => f0(r.dpm)], ["傷害佔比", r => r.dmg_pct, r => (r.dmg_pct == null ? "—" : `${f1(r.dmg_pct)}%`)],
    ["承受傷害", r => r.taken, r => f0(r.taken)], ["視野分數", r => r.vs, r => f1(r.vs)], ["15分經濟差", r => r.gd15, r => sg(r.gd15)],
    ["15分補兵差", r => r.csd15, r => sg(r.csd15)], ["單殺", r => r.solo, r => r.solo]];
  // lane rank, with its movement since before the latest match day (only for players who played that day)
  const before = PREV ? playerRows(PREV.W) : [];
  const laneRank = (set, r, key) => { const v = key(r); if (v == null) return null;
    const lane = set.filter(x => x.role === r.role && key(x) != null);
    return { rank: lane.filter(x => key(x) > v).length + 1, of: lane.length }; };
  const rankOf = (r, key, fmt) => { const now = laneRank(rows, r, key); if (!now) return "";
    const p = before.find(x => x.team === r.team && x.player === r.player), was = p && p.n !== r.n ? laneRank(before, p, key) : null;
    return `${ROLE_SHORT[r.role]}第 ${now.rank} 名 / ${now.of}${was ? rankMove(now.rank, { rank: was.rank, val: fmt(p) }, fmt(r)) : ""}`; };

  const radar = r => radarFig(rows.filter(x => x.role === r.role), [{ row: r, cls: "me" }], r.role);

  const panel = r => {
    const gs = r.games;
    // champion pool
    const pool = {}; gs.forEach(g => { const c = (pool[g.champion] ||= { champ: g.champion, n: 0, w: 0, k: 0, d: 0, a: 0 });
      c.n++; c.w += g.win; c.k += g.k || 0; c.d += g.d || 0; c.a += g.a || 0; });
    const poolRows = Object.values(pool).sort((a, b) => b.n - a.n || b.w / b.n - a.w / a.n);
    // lane opponents, each with every champion pairing and every game
    const opps = {};
    gs.forEach(g => { const o = laneOpp(g); if (!o) return;
      const x = (opps[`${o.team}/${o.player}`] ||= { team: o.team, player: o.player, games: [] }); x.games.push({ me: g, op: o }); });
    const oppCards = Object.values(opps).sort((a, b) => b.games.length - a.games.length).map(o => {
      const n = o.games.length, w = o.games.filter(x => x.me.win).length;
      const pairs = {}; o.games.forEach(x => { const k = `${x.me.champion}|${x.op.champion}`;
        const p = (pairs[k] ||= { mine: x.me.champion, theirs: x.op.champion, n: 0, w: 0 }); p.n++; p.w += x.me.win; });
      return `<article class="pv-opp"><div class="pv-oh">${avatar(o.team, o.player)}<span class="nm"><b>vs <a class="pl-link" href="${plHref(o.team, o.player)}">${esc(o.player)}</a></b><span>${esc(o.team)} · ${ROLE_SHORT[r.role]}</span></span>
          <span class="val">${Math.round(w / n * 100)}%</span><span class="pv-wl">${w}W-${n - w}L</span></div>
        <div class="pv-pairs">${Object.values(pairs).map(p => `<span class="mo ${p.w * 2 > p.n ? "w" : p.w * 2 < p.n ? "l" : ""}">${icon(p.mine)}<span class="pv-vs">vs</span>${icon(p.theirs)}<b>${wrTxt(p.w, p.n)}</b></span>`).join("")}</div>
        <table class="pv-games"><tr><th>輪次</th><th>英雄</th><th>結果</th><th>K/D/A</th><th>對手 K/D/A</th><th>15分經濟差</th></tr>${o.games.map(x => {
          const rn = W.rounds[x.me.round]?.name || "", gi = x.me.match.match(/ G(\d)$/);
          return `<tr><td class="l">${esc(rn)}${gi ? ` 第${gi[1]}局` : ""}</td><td class="l"><span class="pv-ch">${icon(x.me.champion)}<span class="pv-vs">vs</span>${icon(x.op.champion)}</span></td>
            <td><span class="wl ${x.me.win ? "w" : "l"}">${x.me.win ? "勝" : "敗"}</span></td><td>${x.me.k}/${x.me.d}/${x.me.a}</td><td>${x.op.k}/${x.op.d}/${x.op.a}</td>
            <td><span class="dlt ${x.me.gd15 > 0 ? "up" : x.me.gd15 < 0 ? "down" : "flat"}">${sg(x.me.gd15)}</span></td></tr>`; }).join("")}</table></article>`;
    }).join("");
    return `<section class="pv" id="${esc(pid(r))}">
      <div class="pv-head">${avatar(r.team, r.player)}<div><h2>${esc(r.player)}${anc(pid(r))}</h2>
        <p>${esc(fullName(r.team))} · ${ROLE_SHORT[r.role]} · ${r.n} 場 <span class="wr ${wrCls(r.wins / r.n * 100)}">${wrTxt(r.wins, r.n)}</span></p></div></div>
      <div class="pv-top">${radar(r)}
        <div class="pv-stats">${STATS.map(([label, key, fmt]) => `<div class="kpi"><b>${fmt(r)}</b><span>${label}</span><span class="pv-rank">${rankOf(r, key, fmt)}</span></div>`).join("")}</div></div>
      <h3 class="pv-h3">英雄池</h3>
      <div class="wbox"><table class="wtable"><tr><th>英雄</th><th>場數</th><th>戰績</th><th>勝率</th><th>KDA</th></tr>${poolRows.map(c =>
        `<tr><td class="l"><span class="cn-cell">${icon(c.champ)}<span>${esc(cname(c.champ))}</span></span></td><td>${c.n}</td><td>${c.w}-${c.n - c.w}</td>
          <td><span class="wr ${wrCls(c.w / c.n * 100)}">${Math.round(c.w / c.n * 100)}%</span></td><td>${f1((c.k + c.a) / Math.max(1, c.d))}</td></tr>`).join("")}</table></div>
      <h3 class="pv-h3">對線選手</h3>
      <p class="rnote">每位對線選手的總戰績，以及雙方英雄組合的勝率與每場明細（勝負與經濟差皆以 ${esc(r.player)} 為準）。</p>
      <div class="pv-opps">${oppCards || `<div class="cb-empty">尚無對線資料</div>`}</div></section>`;
  };

  // the stats table lives on this page; clicking a player row toggles that player's panel open in a row right below it
  body.innerHTML = sec("選手數據統計", `世界賽正式比賽（已結束 ${doneGames(W).length} 場）的選手個人數據：K/D/A 為累計，其餘為每場平均；KDA =（擊殺 + 助攻）÷ 死亡（0 死以 1 計）。15 分經濟差／補兵差為與對位選手比較。承受傷害 = 每場承受的總傷害；視野分數 = 每場視野分數。滑鼠移到數字上可看該選手在同路線的排名（數值高者為第 1 名）。搶到重擊 = 搶下對手的小龍／巴龍／先鋒等中立目標（gol.gg Objectives Stolen）；被搶重擊 = 該局被對手搶走的目標數，記在打野（持有懲戒）身上。<b>點選手那一列可展開／收合他的對位資訊。</b>數據取自 gol.gg${usesLP(W) ? "；gol.gg 無法連線的場次改用 Leaguepedia 記分板（沒有 15 分經濟差／補兵差、承受傷害、單殺、搶重擊，這些欄位只以有數據的場次計算）" : ""}。${PREV ? `數字旁的 ▲▼ 為與 ${PREV.label}相比的數值變化（只標該日有出賽的選手，累計欄位不標；戰績只標「更新」）；滑鼠移到標記上可看當時數值與同路線名次。` : ""}`,
    playerStats(W), "pl-stats");
  const T = TABLES["player-table"]; if (!T) return;
  const byId = new Map(rows.map(r => [pid(r), r]));
  T.open = null;
  T.rowAttr = (r, zebra) => ` class="pv-tr${zebra ? " zb" : ""}${T.open === pid(r) ? " open" : ""}" data-pid="${esc(pid(r))}" aria-expanded="${T.open === pid(r)}"`;
  T.after = r => (T.open === pid(r) ? `<tr class="pv-row"><td colspan="${T.cols.length}"><div class="pv-inner">${panel(byId.get(pid(r)))}</div></td></tr>` : "");
  const tbl = () => document.getElementById("player-table");
  // keep the panel as wide as the visible table area, pinned left while the wide table scrolls sideways
  const fit = () => { const box = tbl()?.parentElement; if (!box?.clientWidth) return;   // 0 while the tab is hidden
    box.querySelectorAll(".pv-inner").forEach(el => { el.style.width = `${box.clientWidth - 2}px`; }); };
  const redraw = () => { drawTable(T); fit(); const row = tbl()?.querySelector(".pv-row"); if (row) observeReveal(row); };
  const show = (id, toggle) => {
    if (!byId.has(id)) return false;
    T.open = toggle && T.open === id ? null : id;
    redraw();
    try { history.replaceState(null, "", T.open ? `#${encodeURIComponent(T.open)}` : location.pathname + location.search); } catch (_) {}
    return true;
  };
  const prev = T.wireExtra;
  T.wireExtra = () => {
    prev?.();
    tbl()?.querySelector("tbody").addEventListener("click", e => {
      const tr = e.target.closest("tr.pv-tr"); if (!tr) return;
      e.preventDefault();   // the name is also a link; a click here toggles in place
      show(tr.dataset.pid, true);
      // bring the opened row to the top of the scroll pane, just under the frozen header
      const row = tbl().querySelector(`tr.pv-tr[data-pid="${CSS.escape(tr.dataset.pid)}"]`), box = tbl().parentElement;
      if (row && T.open) box.scrollTo({ top: row.offsetTop - tbl().tHead.offsetHeight, behavior: "smooth" });
    });
    // re-fit when the table box changes size: window resize, or the tab becoming visible
    if (typeof ResizeObserver !== "undefined" && tbl()) new ResizeObserver(fit).observe(tbl().parentElement);
    else addEventListener("resize", fit);
    // drawTable runs again on sort / filter: keep the open panel sized and animated
    const sortClick = () => setTimeout(() => { fit(); const row = tbl()?.querySelector(".pv-row"); if (row) observeReveal(row); });
    tbl()?.querySelector("thead").addEventListener("click", sortClick);
    document.querySelector("#pl-stats .rolef")?.addEventListener("click", sortClick);
  };
  PL_SHOW = id => show(id, false);
}

// Worlds player stats table
function playerStats(W) {
  if (!(W.player_games || []).length) return `<div class="cmp-empty">尚無選手比賽數據。</div>`;
  const MV = mvpCounts(W).counts;
  const rows = playerRows(W);
  const f1 = v => (v == null ? "—" : (Math.round(v * 10) / 10).toString());
  const f0 = v => (v == null ? "—" : Math.round(v).toLocaleString());
  const sgn = v => (v == null ? "—" : `<span class="dlt ${v > 0 ? "up" : v < 0 ? "down" : "flat"}">${v > 0 ? "+" : ""}${Math.round(v).toLocaleString()}</span>`);
  const cols = [
    ["選手", r => r.player, true, r => `<td class="l"><a class="who-sm pl-link" href="${plHref(r.team, r.player)}" title="看 ${esc(r.player)} 的選手對位">${avatar(r.team, r.player, true)}<b>${esc(r.player)}</b></a></td>`],
    ["隊伍", r => r.team, true, r => `<td><span class="tm" title="${esc(fullName(r.team))}">${esc(r.team)}</span></td>`],
    ["位置", r => Object.keys(ROLE_SHORT).indexOf(r.role), true, r => `<td>${ROLE_SHORT[r.role]}</td>`],
    // distinct champions played: count first, then each champion once
    ["英雄", r => new Set(r.champs).size, false, r => { const cs = [...new Set(r.champs)];
      return `<td class="l"><span class="champ-cell"><b class="nchamp" title="使用 ${cs.length} 隻英雄">${cs.length}</b><span class="picks2">${cs.map(icon).join("")}</span></span></td>`; }],
    ["場數", r => r.n, false, r => `<td>${r.n}</td>`],
    ["戰績", r => r.wins / r.n, false, r => `<td><span class="wr ${wrCls(r.wins / r.n * 100)}">${r.wins}-${r.n - r.wins}</span></td>`],
    ["K / D / A", r => r.k, false, r => `<td>${r.k} / ${r.d} / ${r.a}</td>`],
    ["KDA", r => r.kda, false, r => `<td><b>${r.perfect ? `${f1(r.kda)}<span class="perf"> 無死</span>` : f1(r.kda)}</b></td>`],
    ["參團率", r => r.kp, false, r => `<td>${r.kp == null ? "—" : `${Math.round(r.kp)}%`}</td>`],
    ["每分補兵", r => r.csm, false, r => `<td>${f1(r.csm)}</td>`],
    ["每分金錢", r => r.gpm, false, r => `<td>${f0(r.gpm)}</td>`],
    ["每分傷害", r => r.dpm, false, r => `<td>${f0(r.dpm)}</td>`],
    ["傷害佔比", r => r.dmg_pct, false, r => `<td>${r.dmg_pct == null ? "—" : `${f1(r.dmg_pct)}%`}</td>`],
    ["承受傷害", r => r.taken, false, r => `<td>${f0(r.taken)}</td>`],
    ["視野分數", r => r.vs, false, r => `<td>${f1(r.vs)}</td>`],
    ["每分視野", r => r.vspm, false, r => `<td>${r.vspm == null ? "—" : r.vspm.toFixed(2)}</td>`],
    ["15分經濟差", r => r.gd15, false, r => `<td>${sgn(r.gd15)}</td>`],
    ["15分補兵差", r => r.csd15, false, r => `<td>${sgn(r.csd15)}</td>`],
    ["單殺", r => r.solo, false, r => `<td>${r.solo}</td>`],
    ["搶到重擊", r => r.steals, false, r => `<td>${r.steals}</td>`],
    ["被搶重擊", r => r.stolenAg, false, r => `<td>${r.stolenAg ?? "—"}</td>`],
  ];
  // MVP column only once some game has an MVP on record
  if (MV.size) cols.splice(6, 0, ["MVP", r => r.mvp, false, r => `<td>${r.mvp ? `<span class="mvp-star">★</span>${r.mvp}` : "0"}</td>`]);
  // rise / fall against the same player before the latest match day, on the per-game averages and win rate
  // (cumulative columns only ever grow, so they get none); [higher is better: 1, neutral: 0, value format]
  const before = PREV ? playerRows(PREV.W) : [], was = new Map(before.map(r => [`${r.team}/${r.player}`, r]));
  const MOVE = { "KDA": [1, f1], "參團率": [1, v => `${Math.round(v)}%`], "每分補兵": [1, f1], "每分金錢": [1, f0],
    "每分傷害": [1, f0], "傷害佔比": [1, v => `${f1(v)}%`], "承受傷害": [0, f0], "視野分數": [1, f1], "每分視野": [1, v => v.toFixed(2)],
    "15分經濟差": [1, f0], "15分補兵差": [1, f1] };
  // hovering a number shows the player's rank in that column among players of the same lane (higher value = 1st, ties share)
  cols.forEach((c, i) => {
    const [label, key, isText, cell] = c;
    if (!key || isText || label === "場數") return;
    const byRole = {}, byRolePrev = {};
    rows.forEach(r => { const v = key(r); if (v != null) (byRole[r.role] ||= []).push(v); });
    before.forEach(r => { const v = key(r); if (v != null) (byRolePrev[r.role] ||= []).push(v); });
    c[3] = r => { const v = key(r), vs = byRole[r.role]; if (v == null || !vs) return cell(r);
      const rank = vs.filter(x => x > v).length + 1, p = was.get(`${r.team}/${r.player}`), pv = p && key(p);
      const prank = pv != null && byRolePrev[r.role] ? `（同路線第 ${byRolePrev[r.role].filter(x => x > pv).length + 1} 名）` : "";
      // the record only says it changed (no up / down); the previous record is in the tooltip
      const mv = !p || p.n === r.n ? ""
        : label === "戰績" ? `<span class="mv flat tip" tabindex="0" data-tip="${esc(`${PREV.label}：${p.wins}-${p.n - p.wins}`)}">更新</span>`
        : MOVE[label] ? valMove(v, pv, MOVE[label][1], MOVE[label][0], prank) : "";
      return cell(r).replace(/^<td/, `<td data-tip="${ROLE_SHORT[r.role]}第 ${rank} 名（共 ${vs.length} 人）"`).replace(/<\/td>$/, `${mv}</td>`); };
  });
  const T = sortTable("player-table", cols, rows, [{ col: cols.findIndex(c => c[0] === "KDA"), desc: true }],   // KDA, high to low
    (a, b) => b.k - a.k || a.player.localeCompare(b.player));
  const chips = `<span class="rolef" id="pl-rolef" role="group" aria-label="位置篩選">${[["", "全部"], ...Object.entries(ROLE_SHORT)].map(([v, l]) =>
    `<button type="button" class="chip" data-role="${v}" aria-pressed="${v === ""}">${l}</button>`).join("")}</span>`;
  T.wireExtra = () => document.getElementById("pl-rolef")?.addEventListener("click", e => {
    const b = e.target.closest("[data-role]"); if (!b) return;
    const v = b.dataset.role;
    T.filter = v ? (r => r.role === v) : null;
    document.querySelectorAll("#pl-rolef .chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
    drawTable(T);
  });
  return sortTableHTML("player-table", chips);
}

// ---- Swiss bracket tree: one column per round, a box per record pool, results boxes (3-x advance, x-3 out) in the
// column after the round that decides them; winners move up a pool, losers down. Records come from the results.
const SW_ROUNDS = 5;
function swissTree(W) {
  const key = (w, l) => `${w}-${l}`;
  // the skeleton: pools of round r have w + l = r (both under 3); 3-l / w-3 results sit in column 3 + l / 3 + w
  const cols = Array.from({ length: SW_ROUNDS + 1 }, (_, c) => ({ c, boxes: [] }));
  const box = {};
  for (let r = 0; r < SW_ROUNDS; r++)
    for (let w = Math.min(2, r); w >= 0 && r - w <= 2; w--) cols[r].boxes.push(box[`p${key(w, r - w)}`] = { id: `p${key(w, r - w)}`, w, l: r - w, r, items: [], ents: [] });
  for (let x = 0; x < 3; x++) {
    cols[3 + x].boxes.unshift(box[`o${key(3, x)}`] = { id: `o${key(3, x)}`, w: 3, l: x, out: "win", ents: [] });
    cols[3 + x].boxes.push(box[`o${key(x, 3)}`] = { id: `o${key(x, 3)}`, w: x, l: 3, out: "lose", ents: [] });
  }
  // walk the rounds: entities are teams with their record, or "A / B 勝方|敗方" slots while a match is unplayed
  let ents = DATA.teams.map(t => ({ team: t.team, w: 0, l: 0 }));
  const place = e => { if (e.w === 3 || e.l === 3) box[`o${key(e.w, e.l)}`].ents.push(e); };
  for (let r = 0; r < SW_ROUNDS; r++) {
    const R = W.rounds[r], live = ents.filter(e => e.w < 3 && e.l < 3);
    if (!R?.matches.length || live.some(e => !e.team)) {   // not drawn yet (or waiting on results): list who is in each pool
      live.forEach(e => box[`p${key(e.w, e.l)}`]?.ents.push(e));
      break;
    }
    const next = ents.filter(e => e.w === 3 || e.l === 3);
    R.matches.forEach((m, k) => {
      const ea = ents.find(e => e.team === m.a), eb = ents.find(e => e.team === m.b); if (!ea || !eb) return;
      box[`p${key(ea.w, ea.l)}`]?.items.push({ m, ri: r, k });
      const up = m.winner ? { team: m.winner } : { label: `${m.a} / ${m.b} 勝方` }, down = m.winner ? { team: m.winner === m.a ? m.b : m.a } : { label: `${m.a} / ${m.b} 敗方` };
      [{ ...up, w: ea.w + 1, l: ea.l }, { ...down, w: ea.w, l: ea.l + 1 }].forEach(e => { next.push(e); place(e); });
    });
    ents = next;
  }
  const score = (m, t) => (!m.winner ? "" : m.score ? m.score[t === m.a ? 0 : 1] : Number(m.winner === t));
  const side = (m, t) => `<span class="sw-t${m.winner ? (m.winner === t ? " w" : " l") : ""}" title="${esc(fullName(t))}"><b>${esc(t)}</b><i>${score(m, t)}</i></span>`;
  const chip = e => (e.team ? `<span class="sw-c" title="${esc(fullName(e.team))}">${esc(e.team)}</span>` : `<span class="sw-c tbd">${esc(e.label)}</span>`);
  const body = b => b.out ? (b.ents.length ? `<div class="sw-cs">${b.ents.map(chip).join("")}</div>` : `<div class="sw-empty">待定</div>`)
    : b.items.length ? b.items.map(({ m, ri, k }) => `<a class="sw-m${m.winner ? "" : " up"}" href="#${matchId(ri, k)}" title="看這場比賽">${side(m, m.a)}${side(m, m.b)}${m.winner ? "" : `<span class="sw-when">${esc(m.time_tw || "未開打")}</span>`}</a>`).join("")
    : b.ents.length ? `<div class="sw-cs">${b.ents.map(chip).join("")}</div><div class="sw-empty">對陣待抽籤</div>` : `<div class="sw-empty">待定</div>`;
  const head = b => b.out ? `${key(b.w, b.l)} ${b.out === "win" ? "晉級" : "淘汰"}` : key(b.w, b.l);
  const count = b => (b.out ? b.ents.filter(e => e.team).length : b.items.length) || "";
  const names = [...W.rounds.slice(0, SW_ROUNDS).map(r => r.name), ...["第一輪", "第二輪", "第三輪", "第四輪", "第五輪"].slice(W.rounds.length)].slice(0, SW_ROUNDS);
  return `<div class="sw-scroll"><div class="sw" id="sw">${cols.map(col => `<div class="sw-col"><div class="sw-ch">${esc(names[col.c] || "結果")}</div>
    <div class="sw-boxes">${col.boxes.map(b => `<div class="sw-box${b.out ? ` sw-out ${b.out}` : ""}" data-k="${b.id}">
      <div class="sw-h">${head(b)}${count(b) ? `<small>${b.out ? `${count(b)} 隊` : `${count(b)} 場`}</small>` : ""}</div>${body(b)}</div>`).join("")}</div></div>`).join("")}
    <svg class="sw-lines" aria-hidden="true"></svg></div></div>`;
}
// connector lines between pools, drawn from the laid-out boxes (again whenever the tree changes size, e.g. its tab opens)
function drawSwissLines() {
  const sw = document.getElementById("sw"), svg = sw?.querySelector(".sw-lines"); if (!svg || !sw.offsetWidth) return;
  const o = sw.getBoundingClientRect(), at = k => sw.querySelector(`[data-k="${k}"]`)?.getBoundingClientRect();
  svg.setAttribute("width", sw.scrollWidth); svg.setAttribute("height", sw.scrollHeight);
  const paths = [];
  sw.querySelectorAll('.sw-box:not(.sw-out)').forEach(el => {
    const [w, l] = el.dataset.k.slice(1).split("-").map(Number), a = el.getBoundingClientRect();
    [[w + 1, l, "w"], [w, l + 1, "l"]].forEach(([w2, l2, cls]) => {
      const b = at(w2 === 3 || l2 === 3 ? `o${w2}-${l2}` : `p${w2}-${l2}`); if (!b) return;
      const x1 = a.right - o.left, y1 = a.top - o.top + a.height / 2 + (cls === "w" ? -6 : 6), x2 = b.left - o.left, y2 = b.top - o.top + Math.min(b.height / 2, 22), mx = (x1 + x2) / 2;
      paths.push(`<path class="sw-e ${cls}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`);
    });
  });
  svg.innerHTML = paths.join("");
}

function renderWorlds(W) {
  if (!W) { document.getElementById("tab-worlds").hidden = true; return; }
  PREV = prevWorlds(W);   // the "before the latest match day" baseline every rise / fall badge compares with
  W.next = nextRound(W) || { name: "下一輪", matches: [] };
  document.getElementById("wv-stage").textContent = W.stage;
  document.getElementById("wv-sub").textContent = `${W.status} 資料整理於 ${W.collected}。`;
  // fold: "open" / "closed" makes the section collapsible (its heading toggles it), starting in that state
  const sec = (title, sub, body, id = `s-${slug(title)}`, fold) => fold
    ? `<section class="wsec fold" id="${esc(id)}"><details${fold === "open" ? " open" : ""}><summary><h2>${title}${anc(id)}</h2>
        <span class="fold-tg" aria-hidden="true"><span class="fold-lb"></span><span class="fold-sw"><i></i></span></span></summary>
        <div class="fold-body">${sub ? `<p>${sub}</p>` : ""}${body}</div></details></section>`
    : `<section class="wsec" id="${esc(id)}"><h2>${title}${anc(id)}</h2>${sub ? `<p>${sub}</p>` : ""}${body}</section>`;

  // round tabs: finished rounds show results + drafts, upcoming rounds show schedule + odds
  // open on the round holding the next unplayed match; when everything is played, the latest round with results
  const upNext = W.rounds.findIndex(r => r.matches.some(m => !m.winner));
  const sel = upNext >= 0 ? upNext : Math.max(0, W.rounds.map(played).lastIndexOf(true));
  const tabs = `<div class="rtabs" role="tablist" aria-label="切換輪次">${W.rounds.map((r, i) =>
    `<button class="rtab" role="tab" id="rtab-${i}" aria-controls="rpanel-${i}" aria-selected="${i === sel}" tabindex="${i === sel ? 0 : -1}" data-i="${i}">
      ${esc(r.name)}<span class="rst ${r.status}">${{ done: "已結束", live: "進行中" }[r.status] || "未開打"}</span></button>`).join("")}</div>`;
  const panels = W.rounds.map((r, i) => `<div class="rpanel" role="tabpanel" id="rpanel-${i}" aria-labelledby="rtab-${i}"${i === sel ? "" : " hidden"}>
    <p class="rnote">${esc(r.format)} · ${esc(r.date)}${r.note ? ` · ${esc(r.note)}` : ""}</p>
    ${r.matches.some(m => !m.winner) ? `${r.matches.some(m => m.winner) ? `<h3 class="rsub">未開打（依時間，最近的在最上面）</h3>` : ""}${upcomingTable(r, i)}` : ""}
    ${r.matches.some(m => m.winner) ? `${r.matches.some(m => !m.winner) ? `<h3 class="rsub">已結束</h3>` : ""}<div class="res-grid">${r.matches.map((m, k) => (m.winner ? matchCard(m, i, k) : "")).join("")}</div>` : ""}</div>`).join("");
  const results = sec("賽事", "", tabs + panels, "wv-rounds", "open");

  const tree = sec("賽程樹狀圖", "瑞士輪每一欄是一輪，依戰績分組；勝方往上一組（綠線）、敗方往下一組（紅線），3 勝晉級淘汰賽、3 敗淘汰。戰績由已結束的賽果推算；點比賽可跳到該場。手機可左右滑動。",
    swissTree(W), "wv-tree", "closed");

  // 英雄資訊變化 has its own tab
  document.getElementById("ch-sub").textContent = "統計所有已結束場次的禁用／選用（BP）。出場率 =（選用 + 禁用）÷ 場數；戰績與勝率以選用該英雄的隊伍輸贏計算。" +
    (PREV ? `數字旁的 ▲▼ 為變化：選用／禁用為增加次數，出場率／勝率為百分點；戰績只標「更新」，「新」為該日才出現的英雄；名字旁的更新圖示表示該英雄在該日被選用或禁用（滑鼠移上可看變化）。${prevNote()}滑鼠移到標記上可看當時數值。` : "");
  document.getElementById("ch-body").innerHTML = champChanges(W);

  // title odds: now vs before round 1, as probability and as decimal odds
  const O = W.outright, maxP = Math.max(...O.rows.map(r => r.poly));
  const delta = r => { const d = Math.round((r.poly - r.pre_poly) * 10) / 10;
    return `<span class="dlt ${d > 0 ? "up" : d < 0 ? "down" : "flat"}">${d > 0 ? "▲ +" : d < 0 ? "▼ " : "– "}${d === 0 ? "0" : d}</span>`; };
  const preOdds = r => r.pre_odds ?? (r.pre_poly ? Math.round(10000 / r.pre_poly) / 100 : null);
  const oddsMove = r => { const p = preOdds(r); if (p == null) return "—";
    const cls = r.poly_odds < p ? "up" : r.poly_odds > p ? "down" : "flat";
    return `${p} → <b>${r.poly_odds}</b> <span class="dlt ${cls}">${cls === "up" ? "▼ 變熱門" : cls === "down" ? "▲ 變冷門" : "持平"}</span>`; };
  const outright = sec("冠軍賠率", `Polymarket 奪冠機率與十進位賠率：第一輪前（${esc(O.pre_label)}）→ 現在（${esc(O.now_label)}）。最右欄為賽前莊家賠率。`,
    `<div class="wbox"><table class="wtable"><tr><th>隊伍</th><th>Swiss</th><th>Polymarket 奪冠 %</th><th>機率變化</th><th>賠率變化（賽前 → 現在）</th><th>Kalshi %</th><th>賽前 Stake（10/12）</th></tr>${
      O.rows.map(r => { const rec = swissRecord(W, r.team);
        return `<tr><td class="l"><span class="tm" title="${esc(fullName(r.team))}">${esc(r.team)}</span></td>
          <td>${rec ? `<span class="rec-chip ${recCls(rec)}">${esc(rec)}</span>` : "—"}</td>
          <td><span class="pbar2" style="width:${Math.max(2, r.poly / maxP * 90)}px"></span>${pct1(r.poly)}</td>
          <td>${delta(r)}</td><td>${oddsMove(r)}</td><td>${pct1(r.kalshi)}</td><td>${r.pre_stake ?? "—"}</td></tr>`; }).join("")
    }</table></div>`);

  // advance markets
  const A = W.advance;
  const advance = sec("晉級機率", A.cols.map(c => `${esc(c.label)}：${esc(c.note)}`).join("；") + "。",
    `<div class="wbox"><table class="wtable"><tr><th>隊伍</th><th>Swiss</th>${A.cols.map(c => `<th>${esc(c.label)}</th>`).join("")}</tr>${
      A.rows.map(r => { const rec = swissRecord(W, r.team);
        return `<tr><td class="l"><span class="tm">${esc(r.team)}</span></td><td>${rec ? `<span class="rec-chip ${recCls(rec)}">${esc(rec)}</span>` : "—"}</td>
          ${A.cols.map((c, i) => `<td>${i === 0 && r[c.key] != null ? `<span class="pbar2" style="width:${r[c.key] * 0.9}px"></span>` : ""}${r[c.key] == null ? "—" : pct1(r[c.key])}</td>`).join("")}</tr>`; }).join("")
    }</table></div>`);

  const mb = mvpBoard(W);
  const mvps = mb ? sec("MVP 統計", "每局 MVP（Player of the Game）次數。", mb, "wv-mvp") : "";
  document.getElementById("wv-body").innerHTML = tree + results + mvps;
  const sw = document.getElementById("sw");
  if (sw && typeof ResizeObserver !== "undefined") new ResizeObserver(() => drawSwissLines()).observe(sw);
  else { drawSwissLines(); addEventListener("resize", drawSwissLines); }
  // 水晶球預測 page: how markets called finished rounds, then forecasts for what's next
  const nextSec = sec(`${esc(W.next.name)}預測<small>${esc(W.next.format || "")}</small>`, "", W.next.matches.length ? upcomingTable(W.next) : "目前沒有未開打的場次。", "pv-next");
  const nDone = doneGames(W).length;
  CB_PREV = PREV ? crystalBall(PREV.W, true) : {};
  const cb = sec("水晶球題目", `世界賽 Pick'Em 水晶球 18 題，依目前已結束 ${nDone} 場的數據列出前三名；選手數據取自 gol.gg${usesLP(W) ? "（無法連線的場次用 Leaguepedia）" : ""}，KDA =（擊殺 + 助攻）÷ 死亡（0 死以 1 計）。${PREV ? `名字旁的 ${prevNote()}單一數值的題目顯示數值變化；滑鼠移到標記上可看當時名次與數值。` : ""}`,
    crystalBall(W), "pv-cb");
  document.getElementById("pv-body").innerHTML = cb + accuracy(W, sec) + nextSec + outright + advance;
  document.getElementById("pv-sub").textContent =
    `整理預測市場（Polymarket、Kalshi）與模型（Outdrafted）對世界賽的預測，並檢驗已結束場次的準確度。資料整理於 ${W.collected}。賠率會變動，僅供參考。`;
  renderMatchups(W, sec);
  renderPlayerVs(W, sec);
  Object.values(TABLES).forEach(T => { wireTable(T); T.wireExtra?.(); });
  const rt = document.querySelector(".rtabs");
  if (rt) {
    const tabsEl = [...rt.querySelectorAll(".rtab")];
    const pick = b => tabsEl.forEach(t => { const on = t === b;
      t.setAttribute("aria-selected", String(on)); t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute("aria-controls")).hidden = !on; });
    rt.addEventListener("click", e => { const b = e.target.closest(".rtab"); if (b) pick(b); });
    rt.addEventListener("keydown", e => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      const i = tabsEl.indexOf(document.activeElement); if (i < 0) return;
      const n = tabsEl[(i + (e.key === "ArrowRight" ? 1 : tabsEl.length - 1)) % tabsEl.length]; n.focus(); pick(n);
    });
  }
  const foot = W.notes.map(n => `<p>${esc(n)}</p>`).join("") +
    `<p>來源：${W.sources.map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join("、")}</p>`;
  document.getElementById("wv-foot").innerHTML = foot;
  document.getElementById("pv-foot").innerHTML = foot;
}

// collapsible sections: clicking the banner slides the content open / shut (height + fade) instead of jumping
function setupFolds() {
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.addEventListener("click", e => {
    const s = e.target.closest(".wsec.fold summary"); if (!s || e.target.closest("[data-anc]")) return;
    e.preventDefault();
    const d = s.parentElement, body = d.querySelector(":scope > .fold-body");
    if (!body || d.dataset.anim) return;   // ignore clicks while it is moving
    const closing = d.open;
    if (still) { d.open = !closing; return; }
    d.dataset.anim = "1";
    if (closing) d.classList.add("closing"); else d.open = true;   // the switch flips right away
    const h = body.scrollHeight;
    body.style.overflow = "hidden";
    const run = body.animate(closing
      ? [{ height: `${h}px`, opacity: 1 }, { height: "0px", opacity: 0 }]
      : [{ height: "0px", opacity: 0 }, { height: `${h}px`, opacity: 1 }],
      { duration: Math.min(650, 260 + h / 6), easing: "cubic-bezier(.2, .7, .2, 1)" });
    run.onfinish = run.oncancel = () => {
      if (closing) { d.open = false; d.classList.remove("closing"); }
      body.style.overflow = ""; delete d.dataset.anim;
    };
  });
}

function render() {
  setupViews();
  setupFolds();
  renderWorlds(DATA.worlds);
  setupTips();
  setupReveal();
  setupMatchPreviews();
  setupAnchors();
  document.getElementById("stamp").textContent = `Worlds 2026 · Swiss Stage${DATA.worlds ? ` · 資料更新 ${DATA.worlds.collected}` : ""}`;
}

// cards (not tables or lists) fade in as they scroll into view, and their single-number values count up from 0
const REVEAL = ".cb, .res, .kpi, .pool, .mvp-item, .pv-opp, .pv-radar";
const COUNT = ".val, .kpi b, .res-side .k, .dmg-h span, .db .dv, .cnt";
function countUp(el) {
  const text = el.textContent, nums = text.match(/[\d,]+(?:\.\d+)?/g);
  if (!nums || nums.length !== 1) return;   // records like 1-0, times like 23:51 and pairs like 623 / 700 stay as they are
  const tok = nums[0], target = parseFloat(tok.replace(/,/g, "")), dec = (tok.split(".")[1] || "").length, comma = tok.includes(",");
  const at = text.indexOf(tok), pre = text.slice(0, at), post = text.slice(at + tok.length);
  const fmt = v => { const s = v.toFixed(dec); return comma ? Number(s).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }) : s; };
  const t0 = performance.now(), dur = 1900;
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - (1 - k) ** 3;
    el.textContent = pre + fmt(target * e) + post;
    if (k < 1) requestAnimationFrame(step); else el.textContent = text; };
  el.textContent = pre + fmt(0) + post;
  requestAnimationFrame(step);
}
let REVEAL_IO = null;
// start watching the cards under `root` (content rendered later, e.g. a newly picked player, calls this too)
function observeReveal(root) {
  if (REVEAL_IO) root.querySelectorAll(REVEAL).forEach(el => { el.classList.add("reveal"); REVEAL_IO.observe(el); });
}
function setupReveal() {
  if (typeof IntersectionObserver === "undefined" || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  REVEAL_IO = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    REVEAL_IO.unobserve(en.target);
    en.target.classList.add("in");
    en.target.querySelectorAll(COUNT).forEach(countUp);
  }), { threshold: 0.15 });
  observeReveal(document);
}

// "#" links copy a URL ending in that block's id; opening such a URL switches to its tab (and round tab),
// scrolls there and flashes it
function setupAnchors() {
  // popup next to the clicked icon: "copied" (or a fallback hint) plus the URL itself
  const pop = document.createElement("div");
  pop.className = "share-pop"; pop.hidden = true; pop.setAttribute("role", "status");
  document.body.append(pop);
  let timer;
  const say = (btn, ok, url) => {
    // show the readable form (e.g. #cb-KDA之王); the clipboard keeps the encoded URL, which pastes safely anywhere
    pop.innerHTML = `<b>${ok ? "已複製連結" : "請手動複製連結"}</b><span class="url">${esc(ok ? decodeURI(url) : url)}</span>`;
    pop.hidden = false;
    const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = `${Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8)}px`;
    pop.style.top = `${r.bottom + 8 + h <= innerHeight ? r.bottom + 8 : Math.max(8, r.top - h - 8)}px`;
    clearTimeout(timer); timer = setTimeout(() => { pop.hidden = true; }, ok ? 3000 : 8000);
  };
  addEventListener("scroll", () => { pop.hidden = true; }, true);
  const go = () => {
    let id = decodeURIComponent(location.hash.slice(1));
    if (VIEWS.includes(id)) { SHOW_VIEW(id); return; }   // #predict etc. (also Back/Forward between tabs)
    id = ANCHOR_ALIAS[id] || id;   // older team-based match links
    if (id.startsWith("hero-")) { SHOW_VIEW("matchup"); requestAnimationFrame(() => MU_SHOW(id.slice(5))); return; }
    // a player's panel is rendered on demand; show its tab first so the panel is measured at the right width
    if (id.startsWith("pl-") && !document.getElementById(id)) { SHOW_VIEW("player"); PL_SHOW(id); }
    const el = id && !VIEWS.includes(id) && document.getElementById(id); if (!el) return;
    const view = el.closest('.view[role="tabpanel"]'); if (view) SHOW_VIEW(view.id.replace("view-", ""));
    // collapsed sections open for a link to them or to anything inside them
    [el.closest("details"), el.querySelector(":scope > details")].forEach(d => { if (d && !d.open) d.open = true; });
    const rp = el.closest(".rpanel"); if (rp?.hidden) document.getElementById(rp.getAttribute("aria-labelledby"))?.click();
    // a link to an unplayed match opens its preview
    if (el.matches("tr.mx-tr") && el.getAttribute("aria-expanded") !== "true") MX_TOGGLE(el);
    requestAnimationFrame(() => {
      el.scrollIntoView({ block: "start", inline: "nearest" });
      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    });
  };
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-anc]"); if (!a) return;
    e.preventDefault();
    const hash = `#${encodeURIComponent(a.dataset.anc)}`, url = location.href.split("#")[0] + hash;
    try { history.replaceState(null, "", hash); } catch (_) {}   // address bar now shows the shared URL
    const copied = navigator.clipboard?.writeText(url);
    copied ? copied.then(() => say(a, true, url), () => say(a, false, url)) : say(a, false, url);
  });
  addEventListener("hashchange", go);
  go();
}

// four pages in one artifact: Worlds results (default), #predict, #matchup and #player
const VIEWS = ["worlds", "champs", "predict", "matchup", "player"];
let SHOW_VIEW = () => {};
function setupViews() {
  const tabs = [...document.querySelectorAll(".vtab")];
  const show = v => {
    tabs.forEach(t => {
      const on = t.dataset.view === v;
      t.setAttribute("aria-selected", String(on));
      t.tabIndex = on ? 0 : -1;
      document.getElementById(`view-${t.dataset.view}`).hidden = !on;
    });
    // on phones the tab row scrolls sideways: keep the chosen tab in sight
    const cur = tabs.find(t => t.dataset.view === v), bar = cur?.parentElement;
    if (bar && bar.scrollWidth > bar.clientWidth) bar.scrollLeft = cur.offsetLeft - (bar.clientWidth - cur.offsetWidth) / 2;
  };
  tabs.forEach(t => t.addEventListener("click", () => { show(t.dataset.view); scrollTo(0, 0); }));
  document.querySelector(".views").addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const i = tabs.indexOf(document.activeElement); if (i < 0) return;
    const n = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
    n.focus(); show(n.dataset.view);
  });
  SHOW_VIEW = show;
  const want = location.hash.slice(1);
  show(VIEWS.includes(want) ? want : "worlds");
}

render();
</script>
